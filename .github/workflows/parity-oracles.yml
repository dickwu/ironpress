name: Parity oracles (fork tooling)

# Fork-only helper: generate missing Chromium PDF oracles for new parity
# fixtures on the refs listed in .github/parity-oracles.json with the
# repository's own pinned generator (scripts/parity-gen-refs.sh +
# scripts/chromium-fontations.sh), then run the full parity gate and upload
# everything needed to commit the result. It never touches upstream state; the
# artifacts are copied into the PR branch by hand.
#
# This branch is not the default branch, so workflow_dispatch cannot address the
# workflow; pushing an updated .github/parity-oracles.json is the trigger.

on:
  push:
    branches: [ci/parity-oracles]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: load
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: .}' .github/parity-oracles.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  oracles:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parity-oracles-cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Install pinned Poppler and deterministic fonts
        timeout-minutes: 15
        run: scripts/parity-install-runtime.sh

      - name: Install snap Chromium (the distribution the committed oracles were produced with)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo snap install chromium
          /snap/bin/chromium --version

      - name: Generate missing oracles
        env:
          PARITY_JOBS: "2"
          CATEGORIES: ${{ matrix.categories }}
        run: |
          set -euo pipefail
          for category in $CATEGORIES; do
            scripts/parity-gen-refs.sh "$category"
          done
          scripts/parity-gen-refs.sh --check
          git status --short tests/parity

      - name: Run parity gate (committed PDF oracles)
        continue-on-error: true
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/parity/fonts/fonts.conf
          PARITY_PDFTOPPM: /usr/bin/pdftoppm
        run: scripts/parity.sh

      - name: Upload oracles, lock, and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-oracles-${{ strategy.job-index }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/parity/oracles/
            tests/parity/refs.lock
            tests/parity/report.json
            tests/parity/REPORT.md
            tests/parity/reports/
            tests/parity/refs/
            tests/parity/diffs/
