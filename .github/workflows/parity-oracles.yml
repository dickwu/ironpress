name: Parity oracles (fork tooling)

# Fork-only helper: generate missing Chromium PDF oracles for new parity
# fixtures on the refs listed in .github/parity-oracles.json with the
# repository's own pinned generator (scripts/parity-gen-refs.sh +
# scripts/chromium-fontations.sh), then run the full parity gate and upload
# everything needed to commit the result. It never touches upstream state; the
# artifacts are copied into the PR branch by hand.
#
# This branch is not the default branch, so workflow_dispatch cannot address the
# workflow; pushing an updated .github/parity-oracles.json is the trigger.

on:
  push:
    branches: [ci/parity-oracles]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: load
        run: |
          set -euo pipefail
          matrix="$(jq -c '{include: .}' .github/parity-oracles.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  oracles:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parity-oracles-cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Install pinned Poppler and deterministic fonts
        timeout-minutes: 15
        run: scripts/parity-install-runtime.sh

      - name: Install snap Chromium (the distribution the committed oracles were produced with)
        if: matrix.categories != ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo snap install chromium
          /snap/bin/chromium --version

      - name: Warm up the snap and verify the Fontations probe
        if: matrix.categories != ''
        env:
          FC_FONTATIONS: "1"
        run: |
          set -euo pipefail
          mkdir -p target/parity-tmp
          html="$PWD/target/parity-tmp/probe.html"
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><style>' \
            '*{margin:0;padding:0;border:0;box-sizing:border-box}' \
            'html,body{font-family:ParitySerif;font-size:16px;line-height:1;background:#fff;color:#000}' \
            '.probe{display:block;width:20ex;height:1px;font-style:normal}.s8{font-size:8px}.s18{font-size:18px}.s30{font-size:30px}' \
            '</style><div class="probe s8"></div><div class="probe s18"></div><div class="probe s30"></div>' \
            '<script>document.fonts.ready.then(()=>document.body.dataset.fontationsEx=[...document.querySelectorAll(".probe")].map(node=>getComputedStyle(node).width).join(","))</script>' \
            > "$html"
          export FONTCONFIG_FILE="$PWD/tests/parity/fonts/fonts.conf" FONTCONFIG_PATH="$PWD/tests/parity/fonts"
          # The snap's first launch initializes its confinement and font caches
          # and can exceed the generator's own 60s probe timeout, so absorb the
          # cold start here with a generous budget and require the pinned
          # metrics before handing over to scripts/parity-gen-refs.sh.
          profile="$(mktemp -d "$PWD/target/parity-tmp/profile.XXXXXX")"
          metrics="$(IRONPRESS_CHROMIUM_EXECUTABLE=/snap/bin/chromium timeout -k 5s 300s scripts/chromium-fontations.sh --headless=new --disable-gpu --no-sandbox --disable-software-rasterizer --user-data-dir="$profile" --virtual-time-budget=5000 --dump-dom "file://$html" | grep -o 'data-fontations-ex="[^"]*"')"
          echo "warm-up probe: $metrics"
          [ "$metrics" = 'data-fontations-ex="80px,200px,320px"' ]

      - name: Route chromium-browser to the snap for the generator
        if: matrix.categories != ''
        run: |
          set -euo pipefail
          # The runner image ships /usr/bin/chromium-browser, which the
          # generator's candidate order prefers but which hangs headless. A
          # PATH shim makes that first candidate resolve to the snap the
          # committed oracles were produced with.
          mkdir -p "$RUNNER_TEMP/chromium-bin"
          # Not a symlink: /snap/bin/chromium is snapd's dispatcher, which
          # selects the app from argv[0]; a wrapper keeps that invocation
          # intact while renaming the candidate.
          printf '#!/bin/sh\nexec /snap/bin/chromium "$@"\n' > "$RUNNER_TEMP/chromium-bin/chromium-browser"
          chmod +x "$RUNNER_TEMP/chromium-bin/chromium-browser"
          "$RUNNER_TEMP/chromium-bin/chromium-browser" --version
          echo "$RUNNER_TEMP/chromium-bin" >> "$GITHUB_PATH"

      - name: Generate missing oracles
        if: matrix.categories != ''
        env:
          PARITY_JOBS: "2"
          CATEGORIES: ${{ matrix.categories }}
        run: |
          set -euo pipefail
          for category in $CATEGORIES; do
            scripts/parity-gen-refs.sh "$category"
          done
          scripts/parity-gen-refs.sh --check
          git status --short tests/parity

      # Mirrors the upstream gate's own freshness step; --check needs no
      # browser, so a baseline-only entry still authenticates refs.lock
      # against the fixtures it is about to accept.
      - name: Refs-freshness gate (refs.lock vs. current fixtures)
        run: scripts/parity-gen-refs.sh --check

      - name: Run parity gate (committed PDF oracles)
        continue-on-error: true
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/parity/fonts/fonts.conf
          PARITY_PDFTOPPM: /usr/bin/pdftoppm
          # "baseline": true accepts the current full run as the reviewed
          # regression baseline (tests/parity/README.md, "An intentional full
          # baseline replacement must be explicit"); corpus and reference
          # integrity still gate.
          PARITY_UPDATE_BASELINE: ${{ matrix.baseline == true && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${PARITY_UPDATE_BASELINE}" ]; then unset PARITY_UPDATE_BASELINE; fi
          scripts/parity.sh

      - name: Upload oracles, lock, and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-oracles-${{ strategy.job-index }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            tests/parity/oracles/
            tests/parity/refs.lock
            tests/parity/baseline.json
            tests/parity/report.json
            tests/parity/REPORT.md
            tests/parity/reports/
            tests/parity/refs/
            tests/parity/diffs/
